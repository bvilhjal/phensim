[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phensim"
dynamic = ["version"]
description = "Genotype and phenotype simulators for genetic association studies"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bjarni Vilhjálmsson" }]
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/bvilhjal/phensim"
Repository = "https://github.com/bvilhjal/phensim"
Issues = "https://github.com/bvilhjal/phensim/issues"

[project.optional-dependencies]
fast = ["numba>=0.59"]
msprime = ["msprime>=1.3"]
test = ["pytest>=7"]
lint = ["ruff>=0.5"]

[tool.setuptools]
packages = ["phensim"]

[tool.setuptools.dynamic]
version = { attr = "phensim.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: heavier simulation-scale test",
    "numba: exercises or requires the Numba JIT path",
    "external: requires an external executable such as PLINK",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["F"]
