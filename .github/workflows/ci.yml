name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
    branches: [master]

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,fast,msprime,lint]"
      - run: ruff check .
      - run: pytest -q
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Check installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -I -c "import phensim; from importlib.metadata import version; assert phensim.__version__ == version('phensim')"
  core-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install "numpy==1.20.0" ".[test]"
      - run: pytest -q -m "not slow"
